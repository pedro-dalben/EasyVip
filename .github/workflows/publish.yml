name: Publicar mod

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Compilar e publicar
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Preparar Gradle
        run: chmod +x ./gradlew

      - name: Testar e compilar
        run: ./gradlew clean build

      - name: Publicar NeoForge
        uses: Kira-NT/mc-publish@v3
        with:
          files: neoforge/build/libs/!(*-@(dev|sources|javadoc)).jar

          name: "${{ github.event.repository.name }} ${{ github.ref_name }}"
          version: "${{ github.ref_name }}"

          changelog-file: RELEASE_NOTES.md

          loaders: neoforge
          game-versions: "1.21.1"
          game-version-filter: none
          java: "21"

          environment: server

          modrinth-id: gjMD4spb
          modrinth-token: "${{ secrets.MODRINTH_TOKEN }}"

          curseforge-id: "1638114"
          curseforge-token: "${{ secrets.CURSEFORGE_TOKEN }}"

          github-tag: "${{ github.ref_name }}"
          github-token: "${{ secrets.GITHUB_TOKEN }}"

          retry-attempts: 3
          fail-mode: fail

      - name: Renomear JAR Fabric
        run: |
          for f in fabric/build/libs/!(*-@(dev|sources|javadoc)).jar; do
            cp "$f" "fabric/build/libs/$(basename "$f" .jar)-fabric.jar"
          done
        shell: bash

      - name: Publicar Fabric
        uses: Kira-NT/mc-publish@v3
        with:
          files: fabric/build/libs/*-fabric.jar

          name: "${{ github.event.repository.name }} ${{ github.ref_name }}"
          version: "${{ github.ref_name }}"

          changelog-file: RELEASE_NOTES.md

          loaders: fabric
          game-versions: "1.21.1"
          game-version-filter: none
          java: "21"

          environment: server

          modrinth-id: gjMD4spb
          modrinth-token: "${{ secrets.MODRINTH_TOKEN }}"

          curseforge-id: "1638114"
          curseforge-token: "${{ secrets.CURSEFORGE_TOKEN }}"

          github-tag: "${{ github.ref_name }}"
          github-token: "${{ secrets.GITHUB_TOKEN }}"

          retry-attempts: 3
          fail-mode: skip
